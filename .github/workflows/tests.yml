name: Testes automatizados

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Dias úteis às 07h (horário de Brasília): detecta mudanças no ambiente público
    # mesmo quando não há commits.
    - cron: '0 10 * * 1-5'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint e formatação
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: 0
      - run: npm run lint
      - run: npm run format:check

  # Etapa rápida: um caminho feliz por cenário. Só depois dela a regressão completa roda.
  smoke:
    name: Smoke
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Cache do binário do Cypress
        uses: actions/cache@v6
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npx cypress install
      - run: npm run test:smoke -- --browser chrome

  cypress:
    name: Cypress (${{ matrix.suite }}, ${{ matrix.browser }})
    runs-on: ubuntu-latest
    needs: smoke
    strategy:
      fail-fast: false
      matrix:
        include:
          - { suite: api, browser: chrome }
          - { suite: e2e, browser: chrome }
          - { suite: e2e, browser: firefox }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Cache do binário do Cypress
        uses: actions/cache@v6
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npx cypress install
      - name: Executa a suíte ${{ matrix.suite }}
        run: npm run test:${{ matrix.suite }} -- --browser ${{ matrix.browser }}
      - name: Guarda o relatório
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cypress-${{ matrix.suite }}-${{ matrix.browser }}
          path: reports/cypress
          if-no-files-found: ignore

  playwright:
    name: Playwright
    runs-on: ubuntu-latest
    needs: smoke
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: 0
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run pw:test
      - name: Guarda o relatório
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright
          path: reports/playwright
          if-no-files-found: ignore

  # Publica os relatórios HTML no GitHub Pages, inclusive quando há falhas nos testes.
  relatorios:
    name: Publica relatórios
    runs-on: ubuntu-latest
    needs: [cypress, playwright]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Reúne os relatórios de todos os jobs
        uses: actions/download-artifact@v8
        with:
          path: site
      - run: mkdir -p site && cp .github/pages/index.html site/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
